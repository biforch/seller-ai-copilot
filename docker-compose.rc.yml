# Disposable RC / staging-style stack. Dev workflow remains docker-compose.yml.
# Usage:
#   docker compose -p sellerai_rc --env-file .env.rc -f docker-compose.rc.yml up --build -d

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required and must end with _test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: sellerai-backend-prod:rc
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required and must end with _test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      AMAZON_SP_API_ENABLED: ${AMAZON_SP_API_ENABLED:-false}
      AMAZON_SP_API_ENDPOINT_MODE: ${AMAZON_SP_API_ENDPOINT_MODE:-mock}
      AMAZON_SP_API_REGION: ${AMAZON_SP_API_REGION:-na}
      AMAZON_LWA_CLIENT_ID: ${AMAZON_LWA_CLIENT_ID:-}
      AMAZON_LWA_CLIENT_SECRET: ${AMAZON_LWA_CLIENT_SECRET:-}
      AMAZON_LWA_TOKEN_URL: ${AMAZON_LWA_TOKEN_URL:-https://api.amazon.com/auth/o2/token}
      AMAZON_SP_API_USER_AGENT: ${AMAZON_SP_API_USER_AGENT:-SellerAI-Copilot/1.0.0 (Language=Python)}
      AMAZON_TOKEN_ACTIVE_KEY_VERSION: ${AMAZON_TOKEN_ACTIVE_KEY_VERSION:-0}
      AMAZON_TOKEN_KEY_V1: ${AMAZON_TOKEN_KEY_V1:-}
      AMAZON_TOKEN_KEY_V0: ${AMAZON_TOKEN_KEY_V0:-}
      AMAZON_TOKEN_FINGERPRINT_PEPPER: ${AMAZON_TOKEN_FINGERPRINT_PEPPER:-}
      AMAZON_OAUTH_ENABLED: ${AMAZON_OAUTH_ENABLED:-false}
      AMAZON_SP_API_APPLICATION_ID: ${AMAZON_SP_API_APPLICATION_ID:-}
      AMAZON_OAUTH_REDIRECT_URI: ${AMAZON_OAUTH_REDIRECT_URI:-}
      AMAZON_OAUTH_FRONTEND_SUCCESS_URL: ${AMAZON_OAUTH_FRONTEND_SUCCESS_URL:-}
      AMAZON_OAUTH_FRONTEND_ERROR_URL: ${AMAZON_OAUTH_FRONTEND_ERROR_URL:-}
      AMAZON_OAUTH_CONSENT_VERSION: ${AMAZON_OAUTH_CONSENT_VERSION:-}
      AMAZON_OAUTH_STATE_TTL_SECONDS: ${AMAZON_OAUTH_STATE_TTL_SECONDS:-600}
      DEBUG: "false"
    command:
      - sh
      - -ec
      - |
        python scripts/validate_rc_environment.py
        exec alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: sellerai-backend-prod:rc
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AMAZON_SP_API_ENABLED: ${AMAZON_SP_API_ENABLED:-false}
      AMAZON_SP_API_ENDPOINT_MODE: ${AMAZON_SP_API_ENDPOINT_MODE:-mock}
      AMAZON_SP_API_REGION: ${AMAZON_SP_API_REGION:-na}
      AMAZON_LWA_CLIENT_ID: ${AMAZON_LWA_CLIENT_ID:-}
      AMAZON_LWA_CLIENT_SECRET: ${AMAZON_LWA_CLIENT_SECRET:-}
      AMAZON_LWA_TOKEN_URL: ${AMAZON_LWA_TOKEN_URL:-https://api.amazon.com/auth/o2/token}
      AMAZON_SP_API_USER_AGENT: ${AMAZON_SP_API_USER_AGENT:-SellerAI-Copilot/1.0.0 (Language=Python)}
      AMAZON_TOKEN_ACTIVE_KEY_VERSION: ${AMAZON_TOKEN_ACTIVE_KEY_VERSION:-0}
      AMAZON_TOKEN_KEY_V1: ${AMAZON_TOKEN_KEY_V1:-}
      AMAZON_TOKEN_KEY_V0: ${AMAZON_TOKEN_KEY_V0:-}
      AMAZON_TOKEN_FINGERPRINT_PEPPER: ${AMAZON_TOKEN_FINGERPRINT_PEPPER:-}
      AMAZON_OAUTH_ENABLED: ${AMAZON_OAUTH_ENABLED:-false}
      AMAZON_SP_API_APPLICATION_ID: ${AMAZON_SP_API_APPLICATION_ID:-}
      AMAZON_OAUTH_REDIRECT_URI: ${AMAZON_OAUTH_REDIRECT_URI:-}
      AMAZON_OAUTH_FRONTEND_SUCCESS_URL: ${AMAZON_OAUTH_FRONTEND_SUCCESS_URL:-}
      AMAZON_OAUTH_FRONTEND_ERROR_URL: ${AMAZON_OAUTH_FRONTEND_ERROR_URL:-}
      AMAZON_OAUTH_CONSENT_VERSION: ${AMAZON_OAUTH_CONSENT_VERSION:-}
      AMAZON_OAUTH_STATE_TTL_SECONDS: ${AMAZON_OAUTH_STATE_TTL_SECONDS:-600}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python3.11",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SellerAI Copilot}
    image: sellerai-frontend-prod:rc
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.rc
    image: sellerai-nginx-prod:rc
    ports:
      - "127.0.0.1:${RC_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
