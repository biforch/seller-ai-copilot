services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: sellerai-postgres
    # Development-only credentials. Override via environment or .env for other environments.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sellerai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellerai123}
      POSTGRES_DB: ${POSTGRES_DB:-sellerai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellerai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: sellerai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sellerai-backend

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sellerai:sellerai123@postgres:5432/sellerai}
      REDIS_URL: redis://redis:6379

      # Xray SOCKS5 proxy
      HTTP_PROXY: socks5h://host.docker.internal:10808
      HTTPS_PROXY: socks5h://host.docker.internal:10808
      ALL_PROXY: socks5h://host.docker.internal:10808

      # 不让内部服务走代理
      NO_PROXY: postgres,redis,localhost,127.0.0.1

    env_file:
      - ./backend/.env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app


  frontend:
    build: ./frontend
    container_name: sellerai-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: SellerAI Copilot
      NEXT_PUBLIC_LISTING_AUDIT_INTERNAL_ENABLED: ${NEXT_PUBLIC_LISTING_AUDIT_INTERNAL_ENABLED:-false}
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules


  nginx:
    image: public.ecr.aws/docker/library/nginx:1.30-alpine@sha256:02b1b2a0445514891a14aa371845f6085d5d9d10d385b30d6aad606a50a29a05
    container_name: sellerai-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend


volumes:
  postgres_data:
