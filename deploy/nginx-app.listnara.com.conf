# Host-level TLS termination for the Vultr adapter. Obtain one certificate with
# SANs for listnara.com, www.listnara.com, and app.listnara.com before enabling.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.listnara.com;

    ssl_certificate /etc/letsencrypt/live/listnara.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listnara.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10M;

    location = /api/v1/amazon/oauth/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.listnara.com listnara.com www.listnara.com;

    location = /api/v1/amazon/oauth/callback {
        access_log off;
        return 301 https://app.listnara.com$request_uri;
    }

    return 301 https://app.listnara.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name listnara.com www.listnara.com;

    ssl_certificate /etc/letsencrypt/live/listnara.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listnara.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://app.listnara.com$request_uri;
}
