upstream rc_backend {
    server backend:8000;
}

upstream rc_frontend {
    server frontend:3000;
}

limit_req_zone $binary_remote_addr zone=oauth_callback_per_ip:10m rate=30r/m;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # limit_req logs the complete request line, including query string. Keep
    # those messages below this error_log level so OAuth callback 429s cannot
    # leak state/code/seller-id canaries into container logs.
    error_log stderr error;
    limit_req_log_level notice;

    # TLS is terminated outside this local-only RC stack. HSTS belongs on that
    # HTTPS edge; emitting it from this HTTP listener would create false assurance.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /api/v1/amazon/oauth/callback {
        access_log off;
        limit_req zone=oauth_callback_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://rc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://rc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        return 404;
    }

    location /redoc {
        return 404;
    }

    location /health {
        proxy_pass http://rc_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        return 404;
    }

    location / {
        proxy_pass http://rc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
