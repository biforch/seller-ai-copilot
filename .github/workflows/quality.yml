name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sellerai
          POSTGRES_PASSWORD: sellerai123
          POSTGRES_DB: sellerai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellerai -d sellerai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      TEST_DATABASE_URL: postgresql://sellerai:sellerai123@localhost:5432/sellerai_test
      MIGRATION_TEST_DATABASE_URL: postgresql://sellerai:sellerai123@localhost:5432/sellerai_migration_test
      JWT_SECRET_KEY: pytest-jwt-secret-key-min-32-chars-long
      OPENAI_API_KEY: test-openai-key-not-used
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy==1.11.2
      - name: Create migration test database
        env:
          PGPASSWORD: sellerai123
        run: >-
          psql -h localhost -U sellerai -d postgres
          -c "CREATE DATABASE sellerai_migration_test OWNER sellerai;"
      - name: Static checks
        working-directory: backend
        run: |
          ruff check app tests scripts
          mypy app scripts
      - name: Full backend test suite
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: SellerAI Copilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate RC Compose configuration
        run: >-
          docker compose --env-file .env.rc.example
          -f docker-compose.rc.yml config --quiet
      - name: Build production backend image
        run: >-
          docker build --file backend/Dockerfile.prod
          --tag sellerai-backend-ci:${{ github.sha }} backend
      - name: Build production frontend image
        run: >-
          docker build --file frontend/Dockerfile.prod
          --build-arg NEXT_PUBLIC_API_URL=/api/v1
          --build-arg "NEXT_PUBLIC_APP_NAME=SellerAI Copilot"
          --tag sellerai-frontend-ci:${{ github.sha }} frontend
      - name: Build RC nginx image
        run: >-
          docker build --file nginx/Dockerfile.rc
          --tag sellerai-nginx-ci:${{ github.sha }} nginx
