name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: sellerai
          POSTGRES_PASSWORD: sellerai123
          POSTGRES_DB: sellerai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellerai -d sellerai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      TEST_DATABASE_URL: postgresql://sellerai:sellerai123@localhost:5432/sellerai_test
      MIGRATION_TEST_DATABASE_URL: postgresql://sellerai:sellerai123@localhost:5432/sellerai_migration_test
      JWT_SECRET_KEY: pytest-jwt-secret-key-min-32-chars-long
      OPENAI_API_KEY: test-openai-key-not-used
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy==1.11.2
      - name: Create migration test database
        env:
          PGPASSWORD: sellerai123
        run: >-
          psql -h localhost -U sellerai -d postgres
          -c "CREATE DATABASE sellerai_migration_test OWNER sellerai;"
      - name: Static checks
        working-directory: backend
        run: |
          python scripts/validate_container_image_pins.py
          ruff check app tests scripts
          mypy app scripts
      - name: Full backend test suite
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: SellerAI Copilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend Node/npm toolchain
        working-directory: frontend
        run: node scripts/validate-node-toolchain.mjs
      - name: Validate frontend lockfile registry
        working-directory: frontend
        run: node scripts/validate-lockfile-registry.mjs
      - name: Frontend lockfile registry tests
        working-directory: frontend
        run: node --test scripts/validate-lockfile-registry.test.mjs
      - name: Frontend toolchain validator tests
        working-directory: frontend
        run: node --test scripts/validate-node-toolchain.test.mjs
      - name: Frontend installed-tree validator tests
        working-directory: frontend
        run: node --test scripts/validate-installed-dependency-tree.test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate installed dependency tree
        working-directory: frontend
        run: node scripts/validate-installed-dependency-tree.mjs
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Run frontend type check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      SYFT_IMAGE: anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pinned container base images
        run: python backend/scripts/validate_container_image_pins.py
      - name: Validate RC Compose configuration
        run: >-
          docker compose --env-file .env.rc.example
          -f docker-compose.rc.yml config --quiet
      - name: Build production backend image
        run: >-
          docker build --file backend/Dockerfile.prod
          --tag sellerai-backend-ci:${{ github.sha }} backend
      - name: Validate backend production runtime environment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "sellerai-backend-ci:${IMAGE_TAG}" \
            python scripts/validate_backend_runtime_environment.py
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "sellerai-backend-ci:${IMAGE_TAG}" \
            python scripts/validate_backend_alpine_os_packages.py
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "sellerai-backend-ci:${IMAGE_TAG}" \
            python scripts/validate_backend_production_smoke.py
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "sellerai-backend-ci:${IMAGE_TAG}" \
            python scripts/validate_alpine_hardened_smoke.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - name: Build production backend arm64 image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file backend/Dockerfile.prod \
            --tag "sellerai-backend-ci:${IMAGE_TAG}-arm64" \
            --load \
            backend
          docker image inspect "sellerai-backend-ci:${IMAGE_TAG}-arm64" --format '{{.Architecture}}' | grep -q '^arm64$'
      - name: Validate production backend arm64 build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="sellerai-backend-ci:${IMAGE_TAG}-arm64"
          docker run --rm --platform linux/arm64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "${IMAGE}" \
            python scripts/validate_backend_runtime_environment.py
          docker run --rm --platform linux/arm64 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "${IMAGE}" \
            python scripts/validate_backend_alpine_os_packages.py
          docker run --rm --platform linux/arm64 "${IMAGE}" sh -c 'test "$(id -u)" -eq 1001'
      - name: Build production frontend image
        run: >-
          docker build --file frontend/Dockerfile.prod
          --build-arg NEXT_PUBLIC_API_URL=/api/v1
          --build-arg "NEXT_PUBLIC_APP_NAME=SellerAI Copilot"
          --tag sellerai-frontend-ci:${{ github.sha }} frontend
      - name: Validate frontend production runtime environment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "sellerai-frontend-ci:${IMAGE_TAG}" \
            node scripts/validate-frontend-runtime.mjs
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "sellerai-frontend-ci:${IMAGE_TAG}" \
            node scripts/validate-frontend-runtime.mjs --smoke
      - name: Build RC nginx image
        run: >-
          docker build --file nginx/Dockerfile.rc
          --tag sellerai-nginx-ci:${{ github.sha }} nginx
      - name: Prepare supply-chain scan workspace
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sellerai-scan/input" "${RUNNER_TEMP}/sellerai-scan/output"
      - name: Save production images for offline scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCAN_INPUT="${RUNNER_TEMP}/sellerai-scan/input"
          docker image save "sellerai-backend-ci:${IMAGE_TAG}" -o "${SCAN_INPUT}/backend.tar"
          docker image save "sellerai-frontend-ci:${IMAGE_TAG}" -o "${SCAN_INPUT}/frontend.tar"
          docker image save "sellerai-nginx-ci:${IMAGE_TAG}" -o "${SCAN_INPUT}/nginx.tar"
      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          SCAN_INPUT="${RUNNER_TEMP}/sellerai-scan/input"
          SCAN_OUTPUT="${RUNNER_TEMP}/sellerai-scan/output"
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/backend.tar \
            -o cyclonedx-json@1.6=/output/backend.cdx.json
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/frontend.tar \
            -o cyclonedx-json@1.6=/output/frontend.cdx.json
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/nginx.tar \
            -o cyclonedx-json@1.6=/output/nginx.cdx.json
      - name: Validate SBOM artifacts
        run: python backend/scripts/validate_sbom_artifacts.py "${RUNNER_TEMP}/sellerai-scan/output"
      - name: Generate Trivy vulnerability reports
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if ! [[ "${RUNNER_UID}" =~ ^[0-9]+$ && "${RUNNER_GID}" =~ ^[0-9]+$ ]]; then
            echo "runner uid/gid validation failed" >&2
            exit 1
          fi
          echo "scanner-user-validated"
          SCAN_INPUT="${RUNNER_TEMP}/sellerai-scan/input"
          SCAN_OUTPUT="${RUNNER_TEMP}/sellerai-scan/output"
          TRIVY_CACHE_DIR="${RUNNER_TEMP}/sellerai-scan/trivy-cache"
          umask 077
          mkdir -p "${SCAN_INPUT}" "${SCAN_OUTPUT}" "${TRIVY_CACHE_DIR}"
          scan_status=0
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            -v "${TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/backend.tar --format json --output /output/backend.trivy.json --scanners vuln --exit-code 0; then
            echo "backend: trivy scan command failed" >&2
            scan_status=1
          fi
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            -v "${TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/frontend.tar --format json --output /output/frontend.trivy.json --scanners vuln --exit-code 0; then
            echo "frontend: trivy scan command failed" >&2
            scan_status=1
          fi
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${SCAN_INPUT}:/input:ro" \
            -v "${SCAN_OUTPUT}:/output:rw" \
            -v "${TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/nginx.tar --format json --output /output/nginx.trivy.json --scanners vuln --exit-code 0; then
            echo "nginx: trivy scan command failed" >&2
            scan_status=1
          fi
          exit "${scan_status}"
      - name: Evaluate vulnerability policy
        run: python backend/scripts/evaluate_vulnerability_report.py "${RUNNER_TEMP}/sellerai-scan/output"
      - name: Upload supply-chain scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sellerai-supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sellerai-scan/output/backend.cdx.json
            ${{ runner.temp }}/sellerai-scan/output/frontend.cdx.json
            ${{ runner.temp }}/sellerai-scan/output/nginx.cdx.json
            ${{ runner.temp }}/sellerai-scan/output/backend.trivy.json
            ${{ runner.temp }}/sellerai-scan/output/frontend.trivy.json
            ${{ runner.temp }}/sellerai-scan/output/nginx.trivy.json
            ${{ runner.temp }}/sellerai-scan/output/scan-summary.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup supply-chain scan workspace
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          CLEANUP_TARGET="${RUNNER_TEMP}/sellerai-scan"
          if [[ "${CLEANUP_TARGET}" == "/" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ -z "${CLEANUP_TARGET}" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ "${CLEANUP_TARGET}" == "${RUNNER_TEMP}" ]]; then
            echo "cleanup target must not equal RUNNER_TEMP root" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" && "${CLEANUP_TARGET}" == "${GITHUB_WORKSPACE}" ]]; then
            echo "cleanup target must not equal workspace root" >&2
            exit 1
          fi
          rm -rf "${CLEANUP_TARGET}"

  backend-alpine-candidate-audit:
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      ALPINE_CANDIDATE_INDEX_REF: python:3.11-alpine3.24@sha256:6857d2dae63e052057f2db389a7061188ac9a92a3fa8d402bde68f36df6fada1
      ALPINE_CANDIDATE_AMD64_REF: python:3.11-alpine3.24@sha256:cc19a3e1085aba7d26690cf0725d9a3e083cbea0feec34ba8133d40a8ac1d399
      ALPINE_CANDIDATE_ARM64_REF: python:3.11-alpine3.24@sha256:df8376721de6f98515643fca8e7aac56e6a39bc178697a1d8c020ffa050b655e
      SYFT_IMAGE: anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pinned container base images
        run: python backend/scripts/validate_container_image_pins.py
      - name: Prepare Alpine candidate audit workspace
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if ! [[ "${RUNNER_UID}" =~ ^[0-9]+$ && "${RUNNER_GID}" =~ ^[0-9]+$ ]]; then
            echo "runner uid/gid validation failed" >&2
            exit 1
          fi
          umask 077
          ALPINE_AUDIT_BASE="${RUNNER_TEMP}/sellerai-alpine-audit"
          mkdir -p \
            "${ALPINE_AUDIT_BASE}/input" \
            "${ALPINE_AUDIT_BASE}/output" \
            "${ALPINE_AUDIT_BASE}/staging-amd64/wheelhouse" \
            "${ALPINE_AUDIT_BASE}/staging-amd64/target" \
            "${ALPINE_AUDIT_BASE}/staging-amd64/home" \
            "${ALPINE_AUDIT_BASE}/staging-arm64/wheelhouse"
      - name: Pull and save Alpine candidate images
        run: |
          set -euo pipefail
          ALPINE_AUDIT_INPUT="${RUNNER_TEMP}/sellerai-alpine-audit/input"
          docker pull --platform linux/amd64 "${ALPINE_CANDIDATE_AMD64_REF}"
          docker pull --platform linux/arm64 "${ALPINE_CANDIDATE_ARM64_REF}"
          docker image save "${ALPINE_CANDIDATE_AMD64_REF}" -o "${ALPINE_AUDIT_INPUT}/candidate-amd64.tar"
          docker image save "${ALPINE_CANDIDATE_ARM64_REF}" -o "${ALPINE_AUDIT_INPUT}/candidate-arm64.tar"
          amd64_meta="$(docker image inspect "${ALPINE_CANDIDATE_AMD64_REF}" --format '{{.Architecture}} {{index .RepoDigests 0}}')"
          arm64_meta="$(docker image inspect "${ALPINE_CANDIDATE_ARM64_REF}" --format '{{.Architecture}} {{index .RepoDigests 0}}')"
          echo "${amd64_meta}" | grep -q 'amd64'
          echo "${arm64_meta}" | grep -q 'arm64'
          echo "${amd64_meta}" | grep -q 'sha256:cc19a3e1085aba7d26690cf0725d9a3e083cbea0feec34ba8133d40a8ac1d399'
          echo "${arm64_meta}" | grep -q 'sha256:df8376721de6f98515643fca8e7aac56e6a39bc178697a1d8c020ffa050b655e'
      - name: Generate Alpine candidate CycloneDX SBOMs
        run: |
          set -euo pipefail
          ALPINE_AUDIT_INPUT="${RUNNER_TEMP}/sellerai-alpine-audit/input"
          ALPINE_AUDIT_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-audit/output"
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${ALPINE_AUDIT_INPUT}:/input:ro" \
            -v "${ALPINE_AUDIT_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/candidate-amd64.tar \
            -o cyclonedx-json@1.6=/output/candidate-amd64.cdx.json
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${ALPINE_AUDIT_INPUT}:/input:ro" \
            -v "${ALPINE_AUDIT_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/candidate-arm64.tar \
            -o cyclonedx-json@1.6=/output/candidate-arm64.cdx.json
      - name: Validate Alpine candidate SBOM artifacts
        run: >-
          python backend/scripts/validate_sbom_artifacts.py --files
          "${{ runner.temp }}/sellerai-alpine-audit/output"
          candidate-amd64.cdx.json candidate-arm64.cdx.json
      - name: Generate Alpine candidate Trivy reports
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if ! [[ "${RUNNER_UID}" =~ ^[0-9]+$ && "${RUNNER_GID}" =~ ^[0-9]+$ ]]; then
            echo "runner uid/gid validation failed" >&2
            exit 1
          fi
          echo "scanner-user-validated"
          ALPINE_AUDIT_INPUT="${RUNNER_TEMP}/sellerai-alpine-audit/input"
          ALPINE_AUDIT_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-audit/output"
          ALPINE_TRIVY_CACHE_DIR="${RUNNER_TEMP}/sellerai-alpine-audit/trivy-cache"
          umask 077
          mkdir -p "${ALPINE_AUDIT_INPUT}" "${ALPINE_AUDIT_OUTPUT}" "${ALPINE_TRIVY_CACHE_DIR}"
          scan_status=0
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${ALPINE_AUDIT_INPUT}:/input:ro" \
            -v "${ALPINE_AUDIT_OUTPUT}:/output:rw" \
            -v "${ALPINE_TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/candidate-amd64.tar --format json --output /output/candidate-amd64.trivy.json --scanners vuln --exit-code 0; then
            echo "candidate-amd64: trivy scan command failed" >&2
            scan_status=1
          fi
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${ALPINE_AUDIT_INPUT}:/input:ro" \
            -v "${ALPINE_AUDIT_OUTPUT}:/output:rw" \
            -v "${ALPINE_TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/candidate-arm64.tar --format json --output /output/candidate-arm64.trivy.json --scanners vuln --exit-code 0; then
            echo "candidate-arm64: trivy scan command failed" >&2
            scan_status=1
          fi
          exit "${scan_status}"
      - name: Audit amd64 musllinux wheel install
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if ! [[ "${RUNNER_UID}" =~ ^[0-9]+$ && "${RUNNER_GID}" =~ ^[0-9]+$ ]]; then
            echo "runner uid/gid validation failed" >&2
            exit 1
          fi
          ALPINE_AUDIT_BASE="${RUNNER_TEMP}/sellerai-alpine-audit"
          ALPINE_AUDIT_OUTPUT="${ALPINE_AUDIT_BASE}/output"
          AMD64_WHEELHOUSE="${ALPINE_AUDIT_BASE}/staging-amd64/wheelhouse"
          AMD64_TARGET="${ALPINE_AUDIT_BASE}/staging-amd64/target"
          AMD64_HOME="${ALPINE_AUDIT_BASE}/staging-amd64/home"
          docker_run_amd64() {
            local network_mode="$1"
            shift
            docker run --rm \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev \
              --network "${network_mode}" \
              --user "${RUNNER_UID}:${RUNNER_GID}" \
              -e HOME=/home/audit \
              -e PYTHONPATH=/audit/ro \
              -e PYTHONNOUSERSITE=1 \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -v "${GITHUB_WORKSPACE}/backend/requirements.txt:/input/requirements.txt:ro" \
              -v "${GITHUB_WORKSPACE}/backend/scripts/audit_alpine_candidate_wheels_amd64.py:/audit/ro/audit_alpine_candidate_wheels_amd64.py:ro" \
              -v "${GITHUB_WORKSPACE}/backend/scripts/alpine_wheel_audit_common.py:/audit/ro/alpine_wheel_audit_common.py:ro" \
              -v "${GITHUB_WORKSPACE}/backend/scripts/validate_target_site_packages.py:/audit/ro/validate_target_site_packages.py:ro" \
              -v "${ALPINE_AUDIT_OUTPUT}:/output:rw" \
              -v "${AMD64_WHEELHOUSE}:/wheelhouse:rw" \
              -v "${AMD64_TARGET}:/target:rw" \
              -v "${AMD64_HOME}:/home/audit:rw" \
              "${ALPINE_CANDIDATE_AMD64_REF}" \
              "$@"
          }
          docker_run_amd64 bridge python /audit/ro/audit_alpine_candidate_wheels_amd64.py probe
          docker_run_amd64 bridge python /audit/ro/audit_alpine_candidate_wheels_amd64.py download
          docker_run_amd64 none python /audit/ro/audit_alpine_candidate_wheels_amd64.py install
      - name: Audit arm64 musllinux wheel resolution
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ALPINE_AUDIT_BASE="${RUNNER_TEMP}/sellerai-alpine-audit"
          PYTHONPATH="${GITHUB_WORKSPACE}/backend/scripts" python backend/scripts/audit_alpine_candidate_wheels_arm64.py \
            backend/requirements.txt \
            "${ALPINE_AUDIT_BASE}/output/wheel-arm64.json" \
            "${ALPINE_AUDIT_BASE}/staging-arm64/wheelhouse"
      - name: Validate Alpine candidate wheel manifests
        if: ${{ !cancelled() }}
        run: python backend/scripts/validate_alpine_candidate_wheel_manifest.py "${RUNNER_TEMP}/sellerai-alpine-audit/output"
      - name: Evaluate Alpine candidate vulnerability policy
        if: ${{ !cancelled() }}
        run: python backend/scripts/evaluate_alpine_candidate_reports.py "${RUNNER_TEMP}/sellerai-alpine-audit/output"
      - name: Upload Alpine candidate audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sellerai-alpine-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sellerai-alpine-audit/output/candidate-amd64.cdx.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/candidate-arm64.cdx.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/candidate-amd64.trivy.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/candidate-arm64.trivy.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/candidate-policy-summary.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/wheel-amd64.json
            ${{ runner.temp }}/sellerai-alpine-audit/output/wheel-arm64.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup Alpine candidate audit workspace
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          CLEANUP_TARGET="${RUNNER_TEMP}/sellerai-alpine-audit"
          if [[ "${CLEANUP_TARGET}" == "/" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ -z "${CLEANUP_TARGET}" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ "${CLEANUP_TARGET}" == "${RUNNER_TEMP}" ]]; then
            echo "cleanup target must not equal RUNNER_TEMP root" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" && "${CLEANUP_TARGET}" == "${GITHUB_WORKSPACE}" ]]; then
            echo "cleanup target must not equal workspace root" >&2
            exit 1
          fi
          rm -rf "${CLEANUP_TARGET}"

  backend-alpine-hardened-candidate:
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      ALPINE_CANDIDATE_INDEX_REF: python:3.11-alpine3.24@sha256:6857d2dae63e052057f2db389a7061188ac9a92a3fa8d402bde68f36df6fada1
      SYFT_IMAGE: anchore/syft:v1.51.0@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pinned container base images
        run: python backend/scripts/validate_container_image_pins.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - name: Prepare Alpine hardened candidate workspace
        run: |
          set -euo pipefail
          umask 077
          HARDENED_BASE="${RUNNER_TEMP}/sellerai-alpine-hardened"
          mkdir -p \
            "${HARDENED_BASE}/input" \
            "${HARDENED_BASE}/output" \
            "${HARDENED_BASE}/staging"
      - name: Build amd64 hardened Alpine backend candidate
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="sellerai-backend-alpine-hardened:${IMAGE_TAG}-amd64"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/Dockerfile.prod \
            --tag "${IMAGE}" \
            --load \
            backend
          docker image inspect "${IMAGE}" --format '{{.Architecture}}' | grep -q '^amd64$'
      - name: Run amd64 hardened runtime and smoke validation
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="sellerai-backend-alpine-hardened:${IMAGE_TAG}-amd64"
          HARDENED_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/output"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "${IMAGE}" \
            python scripts/validate_alpine_hardened_smoke.py
          docker run --rm --user 0 "${IMAGE}" sh -c 'apk info -q' > "${HARDENED_OUTPUT}/amd64-apk-inventory.txt"
          python backend/scripts/write_alpine_hardened_verification_manifest.py amd64 runtime_smoke \
            "${HARDENED_OUTPUT}/backend-alpine-amd64-smoke-manifest.json" \
            --check runtime_environment=true \
            --check alpine_os_packages=true \
            --check production_smoke=true \
            --check hardened_smoke=true \
            --check uvicorn_health=true \
            --check non_root_user=true \
            --apk-inventory-file "${HARDENED_OUTPUT}/amd64-apk-inventory.txt"
          python backend/scripts/validate_alpine_hardened_verification_manifest.py \
            "${HARDENED_OUTPUT}/backend-alpine-amd64-smoke-manifest.json"
      - name: Build arm64 hardened Alpine backend candidate
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="sellerai-backend-alpine-hardened:${IMAGE_TAG}-arm64"
          docker buildx build \
            --platform linux/arm64 \
            --file backend/Dockerfile.prod \
            --tag "${IMAGE}" \
            --load \
            backend
          docker image inspect "${IMAGE}" --format '{{.Architecture}}' | grep -q '^arm64$'
      - name: Run arm64 build-only verification
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="sellerai-backend-alpine-hardened:${IMAGE_TAG}-arm64"
          HARDENED_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/output"
          docker run --rm --platform linux/arm64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "${IMAGE}" \
            python scripts/validate_backend_runtime_environment.py
          docker run --rm --platform linux/arm64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e ENVIRONMENT=testing \
            -e AMAZON_SP_API_ENDPOINT_MODE=mock \
            -e DATABASE_URL=postgresql://localhost:5432/sellerai_test \
            -e OPENAI_API_KEY=runtime-smoke-not-used \
            "${IMAGE}" \
            python scripts/validate_backend_alpine_os_packages.py
          docker run --rm --platform linux/arm64 "${IMAGE}" sh -c 'test "$(id -u)" -eq 1001'
          docker run --rm --platform linux/arm64 --user 0 "${IMAGE}" sh -c 'apk info -q' > "${HARDENED_OUTPUT}/arm64-apk-inventory.txt"
          python backend/scripts/write_alpine_hardened_verification_manifest.py arm64 build_only \
            "${HARDENED_OUTPUT}/backend-alpine-arm64-verification-manifest.json" \
            --check image_config=true \
            --check runtime_environment=true \
            --check alpine_os_packages=true \
            --check non_root_user=true \
            --apk-inventory-file "${HARDENED_OUTPUT}/arm64-apk-inventory.txt"
          python backend/scripts/validate_alpine_hardened_verification_manifest.py \
            "${HARDENED_OUTPUT}/backend-alpine-arm64-verification-manifest.json"
      - name: Save hardened candidate images for offline scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          HARDENED_INPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/input"
          docker image save "sellerai-backend-alpine-hardened:${IMAGE_TAG}-amd64" -o "${HARDENED_INPUT}/backend-alpine-amd64.tar"
          docker image save "sellerai-backend-alpine-hardened:${IMAGE_TAG}-arm64" -o "${HARDENED_INPUT}/backend-alpine-arm64.tar"
      - name: Generate hardened Alpine candidate CycloneDX SBOMs
        run: |
          set -euo pipefail
          HARDENED_INPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/input"
          HARDENED_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/output"
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${HARDENED_INPUT}:/input:ro" \
            -v "${HARDENED_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/backend-alpine-amd64.tar \
            -o cyclonedx-json@1.6=/output/backend-alpine-amd64.cdx.json
          docker run --rm \
            -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "${HARDENED_INPUT}:/input:ro" \
            -v "${HARDENED_OUTPUT}:/output:rw" \
            "${SYFT_IMAGE}" \
            docker-archive:/input/backend-alpine-arm64.tar \
            -o cyclonedx-json@1.6=/output/backend-alpine-arm64.cdx.json
      - name: Validate hardened Alpine candidate SBOM artifacts
        run: >-
          python backend/scripts/validate_sbom_artifacts.py --files
          "${{ runner.temp }}/sellerai-alpine-hardened/output"
          backend-alpine-amd64.cdx.json backend-alpine-arm64.cdx.json
      - name: Generate hardened Alpine candidate Trivy reports
        run: |
          set -euo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if ! [[ "${RUNNER_UID}" =~ ^[0-9]+$ && "${RUNNER_GID}" =~ ^[0-9]+$ ]]; then
            echo "runner uid/gid validation failed" >&2
            exit 1
          fi
          echo "scanner-user-validated"
          HARDENED_INPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/input"
          HARDENED_OUTPUT="${RUNNER_TEMP}/sellerai-alpine-hardened/output"
          HARDENED_TRIVY_CACHE_DIR="${RUNNER_TEMP}/sellerai-alpine-hardened/trivy-cache"
          umask 077
          mkdir -p "${HARDENED_INPUT}" "${HARDENED_OUTPUT}" "${HARDENED_TRIVY_CACHE_DIR}"
          scan_status=0
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${HARDENED_INPUT}:/input:ro" \
            -v "${HARDENED_OUTPUT}:/output:rw" \
            -v "${HARDENED_TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/backend-alpine-amd64.tar --format json --output /output/backend-alpine-amd64.trivy.json --scanners vuln --exit-code 0; then
            echo "backend-alpine-amd64: trivy scan command failed" >&2
            scan_status=1
          fi
          if ! docker run --rm \
            --user "${RUNNER_UID}:${RUNNER_GID}" \
            -e HOME=/tmp/trivy-home \
            -v "${HARDENED_INPUT}:/input:ro" \
            -v "${HARDENED_OUTPUT}:/output:rw" \
            -v "${HARDENED_TRIVY_CACHE_DIR}:/trivy-cache:rw" \
            "${TRIVY_IMAGE}" \
            image --cache-dir /trivy-cache --input /input/backend-alpine-arm64.tar --format json --output /output/backend-alpine-arm64.trivy.json --scanners vuln --exit-code 0; then
            echo "backend-alpine-arm64: trivy scan command failed" >&2
            scan_status=1
          fi
          exit "${scan_status}"
      - name: Evaluate hardened Alpine candidate vulnerability policy
        run: python backend/scripts/evaluate_alpine_hardened_candidate_reports.py "${RUNNER_TEMP}/sellerai-alpine-hardened/output"
      - name: Upload hardened Alpine candidate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sellerai-alpine-hardened-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-amd64.cdx.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-arm64.cdx.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-amd64.trivy.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-arm64.trivy.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-hardened-summary.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-amd64-smoke-manifest.json
            ${{ runner.temp }}/sellerai-alpine-hardened/output/backend-alpine-arm64-verification-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup Alpine hardened candidate workspace
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          CLEANUP_TARGET="${RUNNER_TEMP}/sellerai-alpine-hardened"
          if [[ "${CLEANUP_TARGET}" == "/" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ -z "${CLEANUP_TARGET}" ]]; then
            echo "unsafe cleanup target" >&2
            exit 1
          fi
          if [[ "${CLEANUP_TARGET}" == "${RUNNER_TEMP}" ]]; then
            echo "cleanup target must not equal RUNNER_TEMP root" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" && "${CLEANUP_TARGET}" == "${GITHUB_WORKSPACE}" ]]; then
            echo "cleanup target must not equal workspace root" >&2
            exit 1
          fi
          rm -rf "${CLEANUP_TARGET}"
